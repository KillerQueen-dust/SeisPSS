[project]
name = "seispss"
version = "0.1.0"
description = "Predictive state-space pretraining for seismic waveform understanding"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

requires-python = "==3.12.*"
dependencies = [
    "einops>=0.8.1",
    "hydra-core>=1.3.2",
    "lightning>=2.6.1",
    "numpy>=2.3.3",
    "pandas>=2.3.3",
    "seisbench>=0.11.4",
    "setuptools>=80.9.0",
    "torch>=2.10.0",
    "torchaudio>=2.10.0",
    "torchvision>=0.25.0",
    "wandb>=0.25.1",
]

[project.urls]
Repository = "https://github.com/KillerQueen-dust/SeisPSS"

[project.optional-dependencies]
mamba = [
    "mamba-ssm==2.3.1",
    "causal-conv1d==1.6.1",
]
analysis = ["matplotlib==3.10.8"]

[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true
py-modules = ["pkg_resources"]

[tool.setuptools.packages.find]
where = ["."]
include = ["seispss*"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]
torchaudio = [{ index = "pytorch-cu128" }]

[tool.uv.extra-build-dependencies]
mamba-ssm = [{ requirement = "torch", match-runtime = true }]
causal-conv1d = [{ requirement = "torch", match-runtime = true }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
