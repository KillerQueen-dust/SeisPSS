# @package _global_
defaults:
  - /finetune/stead
  - _self_

seed: 42
run:
  name: r1_stead_scratch_seed${seed}
data:
  training_fraction: 1.0
  train_subset_manifest: protocols/r1/subsets/stead/train_1pct_seed${seed}.csv.gz
  loader_seed: ${seed}
  num_workers: 12
  cache: full
  preload_train: true
  preload_eval: false
  batch_size: 192
  val_batch_size: 192
trainer:
  max_steps: 35000
  val_check_interval: 2000
  num_sanity_val_steps: 0
optim:
  backbone_lr: 0.0001
  head_lr: 0.0003
  schedule:
    total_steps: 35000
    warmup_steps: 3500
transfer:
  init: scratch
eval:
  final_test_after_fit: false
