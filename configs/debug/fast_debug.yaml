# @package _global_

data:
  training_fraction: 0.3
  dataset_sampling:
    num_samples_per_epoch: 20000
  batch_size: 192
  val_batch_size: 192

trainer:
  max_steps: 20000
  val_check_interval: 1.0
  limit_val_batches: 0.25
  num_sanity_val_steps: 0

optim:
  schedule:
    total_steps: 20000
    warmup_steps: 1000
  ema:
    ramp_steps: 20000

checkpoint:
  every_n_train_steps: 2000
